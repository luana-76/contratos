apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: contratos
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-pod-discovery-contratos
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-pod-discovery-contratos
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-pod-discovery-contratos
subjects:
  - { kind: ServiceAccount, name: prometheus, namespace: contratos }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: contratos
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/alerts.yml
    scrape_configs:
      - job_name: apps
        kubernetes_sd_configs:
          - role: pod
            namespaces: { names: [contratos] }
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: job
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
  alerts.yml: |
    groups:
      - name: apis
        rules:
          - alert: ApiDown
            expr: up == 0
            for: 1m
            labels: { severity: critical }
            annotations: { summary: "{{ $labels.pod }} indisponível" }
          - alert: HighErrorRate
            expr: |
              sum by (job) (rate(http_request_duration_ms_count{status_code=~"5.."}[5m]))
                / sum by (job) (rate(http_request_duration_ms_count[5m])) > 0.05
            for: 5m
            labels: { severity: warning }
            annotations: { summary: "{{ $labels.job }}: mais de 5% de respostas 5xx" }
          - alert: HighLatencyP95
            expr: histogram_quantile(0.95, sum by (job, le) (rate(http_request_duration_ms_bucket[5m]))) > 1000
            for: 5m
            labels: { severity: warning }
            annotations: { summary: "{{ $labels.job }}: p95 acima de 1s" }
          - alert: EventLoopLagHigh
            expr: nodejs_eventloop_lag_p99_seconds > 0.5
            for: 2m
            labels: { severity: warning }
            annotations: { summary: "{{ $labels.pod }}: event loop bloqueado (p99 > 500ms)" }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: contratos
spec:
  replicas: 1
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      serviceAccountName: prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
          ports:
            - { name: web, containerPort: 9090 }
          readinessProbe:
            httpGet: { path: /-/ready, port: web }
          livenessProbe:
            httpGet: { path: /-/healthy, port: web }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
            - { name: data, mountPath: /prometheus }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: contratos
spec:
  selector: { app: prometheus }
  ports:
    - { name: web, port: 9090, targetPort: web }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: contratos
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.contratos.svc:9090
        isDefault: true
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: apis
        type: file
        options: { path: /var/lib/grafana/dashboards }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: contratos
spec:
  replicas: 1
  selector:
    matchLabels: { app: grafana }
  template:
    metadata:
      labels: { app: grafana }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        fsGroup: 472
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          ports:
            - { name: web, containerPort: 3000 }
          env:
            - { name: GF_USERS_ALLOW_SIGN_UP, value: "false" }
            - name: GF_SECURITY_ADMIN_USER
              valueFrom: { secretKeyRef: { name: grafana-admin, key: GRAFANA_ADMIN_USER } }
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: grafana-admin, key: GRAFANA_ADMIN_PASSWORD } }
          readinessProbe:
            httpGet: { path: /api/health, port: web }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: provisioning-ds, mountPath: /etc/grafana/provisioning/datasources }
            - { name: provisioning-db, mountPath: /etc/grafana/provisioning/dashboards }
            - { name: dashboards, mountPath: /var/lib/grafana/dashboards }
            - { name: data, mountPath: /var/lib/grafana }
      volumes:
        - name: provisioning-ds
          configMap:
            name: grafana-provisioning
            items: [{ key: datasource.yml, path: datasource.yml }]
        - name: provisioning-db
          configMap:
            name: grafana-provisioning
            items: [{ key: dashboards.yml, path: dashboards.yml }]
        - name: dashboards
          configMap: { name: grafana-dashboards }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: contratos
spec:
  selector: { app: grafana }
  ports:
    - { name: web, port: 3000, targetPort: web }
