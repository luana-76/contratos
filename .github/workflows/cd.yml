name: CD

# Entrega contínua: a cada push na main publica a imagem no GHCR e atualiza o cluster
# Kubernetes com a nova versão (tag = SHA do commit).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: contratos-api
  NS: contratos

jobs:
  publish:
    name: Publicar imagem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Owner em minúsculas (GHCR exige)
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER_LC }}/${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy no Kubernetes
    runs-on: ubuntu-latest
    needs: publish
    environment: production   # permite exigir aprovação manual nas configurações do repositório
    steps:
      - uses: actions/checkout@v4
      - name: Configurar acesso ao cluster
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
      - name: Apontar manifestos para a imagem deste commit
        working-directory: k8s
        run: |
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          sed -i '/^images:/,$d' kustomization.yaml
          cat >> kustomization.yaml <<EOT
          images:
            - name: ${IMAGE}
              newName: ${REGISTRY}/${OWNER_LC}/${IMAGE}
              newTag: ${GITHUB_SHA}
          EOT
          kubectl kustomize . > /dev/null   # valida o resultado antes de aplicar
      - name: Aplicar
        run: |
          kubectl apply -f k8s/00-namespace.yaml
          kubectl apply -k k8s
      - name: Aguardar rollout (falha o job se não ficar saudável)
        run: |
          for d in contratos; do
            kubectl -n "$NS" rollout status deploy/$d --timeout=180s
          done
      - name: Rollback automático em caso de falha
        if: failure()
        run: |
          for d in contratos; do
            kubectl -n "$NS" rollout undo deploy/$d || true
          done
