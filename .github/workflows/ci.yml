name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Auditoria de dependências (somente produção)
        run: npm audit --omit=dev --audit-level=high

  validate-infra:
    name: Validação da infraestrutura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: |
          cp .env.example .env
          docker compose config -q
      - name: Validar manifestos Kubernetes (kubeconform)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          kubectl kustomize k8s | ./kubeconform -strict -summary -ignore-missing-schemas

  image-scan:
    name: Build e scan da imagem
    runs-on: ubuntu-latest
    needs: [test, validate-infra]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: contratos-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy (falha em vulnerabilidades HIGH/CRITICAL com correção disponível)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: contratos-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
